name: Deploy web app to Azure Static Web Apps

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [ "main" ]
    paths:
      - 'OakGroveCommunityCouncil/Frontend/**' # Only run this if something in the frontend changed

env:
  APP_LOCATION: "OakGroveCommunityCouncil/Frontend" # Location of client code
  APP_ARTIFACT_LOCATION: "dist" # Location of client code build output, relative to the above (this is where tsc puts the JavaScript output after Vite runs)
  AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }} # Secret containing deployment token for the static web app (found in Portal)

permissions:
  contents: read

jobs:
  build_and_deploy_job:
    permissions:
      contents: read # For actions/checkout to fetch code
      pull-requests: write # For Azure/static-web-apps-deploy to comment on PRs
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          app_location: ${{ env.APP_LOCATION }}
          app_artifact_location: ${{ env.APP_ARTIFACT_LOCATION }}
          app_build_command: 'yarn run build' # Default is NPM but we use Yarn
          skip_api_build: true # We don't have an API to deploy here

  close_pull_request_job:
    permissions:
      contents: none
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"
